name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # every Monday, so that a new JAX release that breaks the package is noticed
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and Windows are both supported, so both are tested.
        os: [ubuntu-latest, windows-latest]
        # 3.10 installs the oldest supported JAX line, 3.13 the newest JAX release
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        shell: bash      # Git Bash on Windows, so every step is the same command on both systems
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Versions
        run: python -c "import sys, platform, jax, numpy; print(platform.system(), sys.version.split()[0], 'jax', jax.__version__, 'numpy', numpy.__version__)"
      - name: Test
        run: python -m pytest -q
