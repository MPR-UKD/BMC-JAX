name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # every Monday, so that a new JAX release that breaks the package is noticed
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 installs the oldest supported JAX line, 3.13 the newest JAX release
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Versions
        run: python -c "import sys, jax, numpy; print(sys.version.split()[0], 'jax', jax.__version__, 'numpy', numpy.__version__)"
      - name: Test
        run: pytest -q
