[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bmc-jax"
version = "0.2.0"
description = "Differentiable Bloch-McConnell simulation and CEST parameter fitting in JAX"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Goundi Dali" }]
keywords = ["MRI", "CEST", "Bloch-McConnell", "quantitative MRI", "simulation", "JAX", "GPU"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Physics",
]

# The core is jax + numpy and nothing else. Everything that reads a file format or
# validates against another implementation is optional, so `pip install bmc-jax` can
# never fail on a dependency the simulator does not use.
dependencies = ["numpy", "jax>=0.6"]

[project.urls]
Homepage = "https://github.com/MPR-UKD/BMC-JAX"
Repository = "https://github.com/MPR-UKD/BMC-JAX"
Issues = "https://github.com/MPR-UKD/BMC-JAX/issues"
Changelog = "https://github.com/MPR-UKD/BMC-JAX/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pulseq    = ["pypulseq"]          # reading and writing .seq
reference = ["bmctool"]           # YAML configs + the CPU solver used for cross-validation
dev       = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bmc_jax.io" = ["configs/*.yaml"]

[tool.pytest.ini_options]
# The docstring examples run as tests, so an example that stops being true fails the suite
# instead of quietly misleading whoever reads it next.
addopts = "--doctest-modules"
testpaths = ["tests", "src/bmc_jax/io"]
